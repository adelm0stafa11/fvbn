<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#243447"/>
      <stop offset="100%" stop-color="#111720"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae2c8"/>
      <stop offset="50%" stop-color="#cb9764"/>
      <stop offset="100%" stop-color="#a67341"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="12" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="10 10" opacity="0.65"/>

  <!-- Core Emblem Plate -->
  <circle cx="256" cy="256" r="130" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6"/>

  <!-- Center Vault / Coin Icon -->
  <g fill="none" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="256" r="60" stroke-width="10"/>
    <circle cx="256" cy="256" r="28" stroke-width="7"/>
    <!-- Vault Spoke Accents -->
    <line x1="256" y1="172" x2="256" y2="196" stroke-width="8"/>
    <line x1="256" y1="316" x2="256" y2="340" stroke-width="8"/>
    <line x1="172" y1="256" x2="196" y2="256" stroke-width="8"/>
    <line x1="316" y1="256" x2="340" y2="256" stroke-width="8"/>
    <line x1="196" y1="196" x2="214" y2="214" stroke-width="8"/>
    <line x1="298" y1="298" x2="316" y2="316" stroke-width="8"/>
    <line x1="196" y1="316" x2="214" y2="298" stroke-width="8"/>
    <line x1="298" y1="214" x2="316" y2="196" stroke-width="8"/>
  </g>

  <!-- Center Star Motif -->
  <polygon points="256,236 262,250 276,256 262,262 256,276 250,262 236,256 250,250" fill="url(#goldGrad)"/>
</svg>
